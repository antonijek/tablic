<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tablić online — igraj besplatno protiv računara</title>
  <meta name="description" content="Tablić online, besplatno i bez registracije: 1 na 1, u troje ili 2 na 2 protiv računara. Prava pravila tablića, igra u pregledaču i na telefonu.">
  <meta name="theme-color" content="#0b2e1d">
  <link rel="canonical" href="https://tablic.igrajmo.online/">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tablić online — igraj besplatno">
  <meta property="og:description" content="1 na 1, u troje ili 2 na 2 protiv računara. Prava pravila tablića, bez registracije.">
  <meta property="og:url" content="https://tablic.igrajmo.online/">
  <meta property="og:image" content="https://tablic.igrajmo.online/icons/og-image.jpg">
  <meta property="og:locale" content="sr_RS">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "Tablić online",
    "url": "https://tablic.igrajmo.online/",
    "description": "Tablić protiv računara: 1 na 1, u troje ili 2 na 2, po pravim pravilima.",
    "inLanguage": "sr",
    "genre": "Kartaška igra",
    "gamePlatform": "Web pregledač",
    "applicationCategory": "Game",
    "operatingSystem": "Any",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
  }
  </script>
  <link rel="stylesheet" href="./tablic.css">
</head>
<body>
  <header class="topbar">
    <h1>Tablić</h1>
    <div id="scoreBar" class="score" aria-live="polite"></div>
    <div class="top-buttons">
      <button id="soundBtn" class="icon-btn" aria-label="Zvuk">🔊</button>
      <button id="menuBtn" class="icon-btn" aria-label="Meni">☰</button>
    </div>
  </header>

  <main class="room">
    <div class="table" aria-hidden="true"></div>
    <div id="opponents"></div>
    <section class="table-area">
      <div id="roundInfo" class="deck-info"></div>
      <div id="table" class="table-cards" aria-label="Sto"></div>
      <div id="toast" class="toast" role="status"></div>
    </section>
    <section id="seatMe" class="seat seat-me"></section>
  </main>

  <section class="bottom">
    <p id="hint" class="hint"></p>
    <div id="myHand" class="hand" aria-label="Vaše karte"></div>
    <div class="buttons">
      <button id="suggestBtn" class="btn ghost">Predlog</button>
      <button id="throwBtn" class="btn">Baci na sto</button>
      <button id="captureBtn" class="btn primary">Nosi</button>
    </div>
  </section>

  <dialog id="menu">
    <h2>Meni</h2>
    <fieldset class="players-pick">
      <legend>Nova igra</legend>
      <label><input type="radio" name="players" value="2" id="players2" checked> 1 na 1 protiv računara</label>
      <label><input type="radio" name="players" value="3" id="players3"> U troje (svako za sebe)</label>
      <label><input type="radio" name="players" value="4" id="players4"> U četvoro, 2 na 2 (partner je računar)</label>
    </fieldset>
    <div class="dialog-buttons">
      <button id="newGameBtn" class="btn primary">Počni novu igru</button>
    </div>
    <div class="menu-daily">
      <button id="dailyBtn" class="btn">🗓️ Dnevni izazov</button>
      <span class="note">Isto deljenje za sve igrače danas — jedna partija, rezultat možete podeliti.</span>
    </div>
    <div class="dialog-buttons">
      <a class="btn ghost" href="./pravila.html">Pravila</a>
      <button id="closeMenuBtn" class="btn ghost">Zatvori</button>
    </div>
  </dialog>

  <dialog id="dailyDone">
    <h2>Današnji izazov je odigran</h2>
    <p id="dailyDoneText"></p>
    <div class="dialog-buttons">
      <button id="dailyShareBtn" class="btn primary">Podeli rezultat</button>
      <button id="closeDailyBtn" class="btn ghost">Zatvori</button>
    </div>
  </dialog>

  <dialog id="dealEnd">
    <h2 id="dealEndTitle">Kraj partije</h2>
    <table class="result">
      <thead id="dealEndHead"></thead>
      <tbody id="dealEndBody"></tbody>
    </table>
    <p id="dealEndNote" class="note"></p>
    <div class="dialog-buttons">
      <button id="nextDealBtn" class="btn primary">Sledeća partija</button>
      <button id="shareBtn" class="btn" hidden>Podeli rezultat</button>
    </div>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
